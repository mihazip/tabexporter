<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TabExporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="summary">
      <div class="count" id="count">–</div>
      <div class="count-label" id="count-label">open tabs</div>
    </header>

    <fieldset class="formats">
      <legend>Format</legend>
      <label><input type="radio" name="format" value="txt" checked><span>Text</span></label>
      <label><input type="radio" name="format" value="md"><span>Markdown</span></label>
      <label><input type="radio" name="format" value="csv"><span>CSV</span></label>
    </fieldset>

    <div class="actions">
      <button id="save" class="primary">Save file</button>
      <button id="share" hidden>Share</button>
      <button id="copy">Copy to clipboard</button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <section class="preview">
      <h2>Tabs</h2>
      <ol id="list"></ol>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
